version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: giftlink-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=giftlink

  giftlink-api:
    build: .
    container_name: giftlink-api
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/giftlink
      - JWT_SECRET=giftlink_secret_key_2024
      - NODE_ENV=production
    depends_on:
      - mongodb

volumes:
  mongodb_data:
